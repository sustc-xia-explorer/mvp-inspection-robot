# Software self-test only. Matches the bundled 1.6 x 2.0 m model.
receding: 10
step_time: 0.1
ref_speed: 0.2
collision_threshold: 0.05
robot:
  kinematics: diff
  length: 1.6
  width: 2.0
  max_speed: [0.3, 0.6]
  max_acce: [0.5, 1.0]
ipath:
  curve_style: line
  loop: false
  arrive_threshold: 0.1
  close_threshold: 0.1
  ind_range: 10
  arrive_index_threshold: 1
pan:
  iter_num: 2
  dune_max_num: 100
  nrmp_max_num: 10
  iter_threshold: 0.1
adjust:
  q_s: 1.0
  p_u: 1.0
  eta: 15.0
  d_max: 1.0
  d_min: 0.1
  ro_obs: 10.0
  bk: 0.0
