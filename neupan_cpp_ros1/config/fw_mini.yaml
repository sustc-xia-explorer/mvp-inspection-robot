# Initial low-speed MODE-2 diff-equivalent configuration.
# Measure the installed envelope. base_link is assumed at footprint centre.
receding: 10
step_time: 0.1
ref_speed: 0.15
collision_threshold: 0.03
robot:
  kinematics: diff
  length: 0.495
  width: 0.360
  wheelbase: 0.0  # origin-offset convention, not physical 0.35 m wheelbase
  max_speed: [0.2, 0.4]
  max_acce: [0.3, 0.6]
ipath:
  curve_style: line
  loop: false
  arrive_threshold: 0.10
  close_threshold: 0.10
  ind_range: 10
  arrive_index_threshold: 1
pan:
  iter_num: 2
  dune_max_num: 100
  nrmp_max_num: 10
  iter_threshold: 0.1
adjust:
  q_s: 1.0
  p_u: 1.0
  eta: 15.0
  d_max: 0.5
  d_min: 0.1
  ro_obs: 10.0
  bk: 0.0
